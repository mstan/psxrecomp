# SCPH-101 (US PSOne, v4.5 05/25/00)
# Boot + kernel are byte-identical to SCPH1001 (534 seeds kept).
# Shell (ROM 0x18000+, 568 seeds) differs — runs via dirty-RAM interpreter.

[program]
name = "SCPH101 BIOS (PSOne)"
id = "SCPH-101"
rom = "bios/US-PSOne-SCPH101.BIN"
load_address = "0xBFC00000"
entry_pc = "0xBFC00000"
text_size = "0x80000"

[recompiler]
seeds = "recompiler/seeds/phase2_ghidra_seeds_SCPH101.json"
out_dir = "generated"
out_stem = "SCPH101"
strict = true

# SCPH101 shares SCPH1001's A0/B0/C0 dispatch tables and kernel layout.
# The BIOS vector table ROM addresses and aliases are identical.
[[recompiler.bios_vectors]]
ram_addr = "0xA0"
index_reg = 9
table_rom_addr = "0xBFC04300"
table_count = 0xC1
table_ram_addr = "0x200"

[[recompiler.bios_vectors]]
ram_addr = "0xB0"
index_reg = 9
table_rom_addr = "0xBFC10874"
table_count = 0x44
table_ram_addr = "0x874"

[[recompiler.bios_vectors]]
ram_addr = "0xC0"
index_reg = 9
table_rom_addr = "0xBFC10674"
table_count = 0x1E
table_ram_addr = "0x674"

[[recompiler.bios_aliases]]
ram_addr = "0xCF0"
target_key = "0x641C"
